name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt }} / ${{ matrix.shared && 'shared' || 'static' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        qt: ['6.8.*', '6.10.*']
        shared: [false]
        exclude:
          - os: macos-latest
            qt: '6.8.*'
        include:
          - os: ubuntu-24.04
            qt: '6.8.*'
            shared: true
          # The last open-source Qt 6.8 (6.8.3) links the AGL framework, which
          # the macOS 26 SDK no longer has (QTBUG-137687, fixed in 6.8.4 and
          # 6.9.2). It needs the macOS 15 SDK, i.e. Xcode 16.
          - os: macos-15
            qt: '6.8.*'
            shared: false
            xcode: '16'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: matrix.xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build xvfb libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=${{ matrix.shared && 'ON' || 'OFF' }}
          -DQFLEXDOCK_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (offscreen)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test (X11 via Xvfb)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -DQFLEXDOCK_TEST_PLATFORM=xcb
          xvfb-run -a -s "-screen 0 2000x1200x24" ctest --test-dir build -C Release --output-on-failure

      # Real Wayland platform plugin inside a private headless compositor.
      - name: Test (Wayland, headless)
        if: runner.os == 'Linux' && !matrix.shared
        run: |
          sudo apt-get install -y weston dbus
          cmake -S . -B build -DQFLEXDOCK_TEST_PLATFORM=
          tests/run-on-wayland.sh build -C Release

      - name: Install and build the find_package consumer
        run: |
          cmake --install build --config Release --prefix "${{ github.workspace }}/prefix"
          cmake -S tests/consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/prefix"
          cmake --build build-consumer --config Release

  sanitizers:
    name: ASan + UBSan (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DQFLEXDOCK_SANITIZERS=address,undefined
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=0
